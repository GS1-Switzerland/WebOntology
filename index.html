<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12181F" />
    <meta name="description" content="GS1 Web Ontology & Vocabulary Explorer — browse, search and resolve sector and domain vocabularies published as Linked Data." />
    <!-- Content-Security-Policy is enforced at the edge via staticwebapp.config.json;
         this meta tag is a defence-in-depth fallback for direct file previews. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://gs1-switzerland.github.io https://*.github.io; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" />
    <title>GS1 Web Ontology &amp; Vocabulary Explorer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
